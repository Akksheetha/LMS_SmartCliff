eration compeleted message\r\n\r\n        \r\n        Scenario: user cancel the save operation while submodule is saving\r\n\r\n             When the user enable the hierarchy Action\r\n              And the user click the threeDot_btn\r\n              And the user click the Add btn\r\n              And the user enter the title from csv row 0\r\n              And the user enter the Description from csv row 0\r\n              And the user click the skill\r\n              And the user click save and immediately click cancel\r\n             Then the submodule should able to cancel the process\r\n","uri":"src\\test\\Features\\Submodule.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[{"location":{"line":1,"column":1},"name":"@jeeva","id":"10a972da-6ff6-40c7-b11a-7f1239119b32"}],"location":{"line":2,"column":1},"language":"en","keyword":"Feature","name":"JeevaPranesh_07_JULY_2026_submodule functionality__updated_09_July_2026","description":"Feature Description","children":[{"background":{"id":"6f6328a4-b153-4b2c-b749-455faad863da","location":{"line":6,"column":9},"keyword":"Background","name":"","description":"","steps":[{"id":"0e753656-3912-4121-aeb8-550c809e633e","location":{"line":7,"column":13},"keyword":"Given ","keywordType":"Context","text":"user launch the application of lms-smartcliff"},{"id":"f012336a-4668-4834-9256-e0dd49fc9871","location":{"line":8,"column":14},"keyword":"When ","keywordType":"Action","text":"the user login with valid data"},{"id":"ca16ddfa-3d09-49e5-b58f-37a55109fdb7","location":{"line":9,"column":15},"keyword":"And ","keywordType":"Conjunction","text":"the user click the course management"},{"id":"ee67a1a8-6f9a-47b1-b08a-41097e688ed0","location":{"line":10,"column":15},"keyword":"And ","keywordType":"Conjunction","text":"the user seach the course code , which is already created"},{"id":"d3e82b92-558b-4511-be80-c94052d46c1b","location":{"line":11,"column":15},"keyword":"And ","keywordType":"Conjun
